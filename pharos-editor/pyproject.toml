[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-editor"
version = "0.1.0a1"
description = "Nova3D-parity desktop editor for PharosEngine — imgui-bundle backend, real dockable panels, theme catalogue."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["game-engine", "editor", "imgui", "pharos"]
authors = [{ name = "Andrew Watts" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# The editor is a thin Python wrapper — the engine wheel does all the
# heavy lifting. `imgui-bundle` gives us Nova3D's DockBuilder /
# DockingParams API + wgpu-backed rendering surface.
dependencies = [
    "pharos-engine==0.1.0a1",
    "imgui-bundle>=1.6",
]

[project.scripts]
pharos-edit = "pharos_editor.ui.editor_v2.__main__:main"

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/Pharos"
Repository = "https://github.com/andrewkwatts-maker/Pharos"
Issues = "https://github.com/andrewkwatts-maker/Pharos/issues"

[tool.setuptools]
package-dir = {"" = "../python"}

[tool.setuptools.packages.find]
where = ["../python"]
include = ["pharos_editor*"]
exclude = ["pharos_engine*"]

[tool.setuptools.package-data]
"pharos_editor" = [
    "themes/*.yaml",
]
