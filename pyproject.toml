[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pharos-engine"
version = "0.0.1a1"
description = "A Rust + wgpu game engine with a Python authoring surface. Headless-runnable; the desktop editor is a separate optional wheel."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["game-engine", "wgpu", "vulkan", "rust", "pyo3", "3d", "2d"]
authors = [{ name = "Andrew Watts" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "lz4>=4.0",
]

[project.scripts]
pharos = "pharos_engine.cli:main"

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/Pharos"
Repository = "https://github.com/andrewkwatts-maker/Pharos"
Issues = "https://github.com/andrewkwatts-maker/Pharos/issues"
Changelog = "https://github.com/andrewkwatts-maker/Pharos/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# `pip install pharos-engine[editor]` pulls the desktop editor wheel.
# The engine itself has zero UI dependencies; the editor is entirely
# optional.
editor = ["pharos-editor==0.0.1a1"]
# 3D asset import — glTF 2.0 + Wavefront OBJ + STL/PLY (trimesh) +
# HDR/EXR/DDS textures. Kept behind an extra so 2D-only users don't
# pay the ~30 MB install cost.
assets = [
    "pygltflib>=1.16",
    "trimesh>=4.0",
    "imageio>=2.34",
]
# Runtime game HUD — immediate-mode UI backed by imgui[glfw].
hud = ["imgui[glfw]>=2.0"]
# Video recording / import (GIF capture, asset ingest).
video = [
    "av>=12.0",
    "imageio-ffmpeg>=0.4",
]
# Audio backends.
audio = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
# Dev-time tooling (pytest + wheel builder).
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "watchdog>=3.0",
    "maturin>=1.5",
]
# Multiplayer / peer-to-peer networking.
network = [
    "kademlia>=2.2.2",
    "aioice>=0.9.0",
    "zeroconf>=0.131",
    "websockets>=12.0",
]

[tool.maturin]
python-source = "python"
module-name = "pharos_engine._core"
features = ["pyo3/extension-module"]
manifest-path = "crates/pharos_py/Cargo.toml"
# Ship only what the engine needs at runtime. Editor tree, tests,
# examples, docs, benchmarks, dev artefacts are all excluded.
include = [
    "python/pharos_engine/prefabs/baked/*.prefab.yaml",
    "python/pharos_engine/prefabs/baked/previews/*.png",
    "python/pharos_engine/post_process/baked_chains/*.chain.yaml",
]
strip = true
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.pdb",
    "**/tests",
    "**/examples",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "python/pharos_editor",
    "python/pharos_editor/**",
    "target",
    "target/**",
    ".venv",
    ".venv/**",
    "scripts",
    "scripts/**",
    "examples",
    "examples/**",
    "docs",
    "docs/**",
    ".github",
    ".github/**",
    ".cargo",
    ".cargo/**",
    ".gitignore",
    "CHANGELOG.md",
    "pharos-editor",
    "pharos-editor/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
