# Default engine.yml shipped inside the pharos-engine wheel.
#
# This file is the fallback loaded by pharos_engine.config._find_config_dir()
# when the user has not created a project-local config/ directory and has
# not set the SLAPPY_CONFIG_DIR environment variable. The values below
# are the same alpha-safe defaults documented in config_defaults.py; a
# game/app that wants to customise them should copy this file to
# <project>/config/engine.yml and edit it there rather than modifying the
# installed wheel.

window:
  title: "Pharos"
  width: 1280
  height: 720
  clear_color: [0.05, 0.06, 0.08, 1.0]
  vsync: true

rendering:
  max_layers_per_asset: 64
  max_frames_per_animation: 64
  texture_format: "rgba8unorm-srgb"
  backend: "auto"
  power_preference: "high_performance"

residency:
  streaming_radius_gpu: 500
  streaming_radius_ram: 2000
  vram_budget_mb: 512
  ram_budget_mb: 2048
  tile_cache_size: 64
  save_dir: "."

compute:
  workgroup_size_x: 16
  workgroup_size_y: 16
  max_readback_buffers: 8

physics:
  default_dt: 0.016667
  substeps: 1

tags:
  max_bits: 64
