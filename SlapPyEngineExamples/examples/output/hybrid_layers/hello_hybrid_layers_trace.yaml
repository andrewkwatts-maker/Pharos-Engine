note: DDD3 sprint -- compositor walks Layer3D + Layer2D + Layer3D in z_order and composes
  them. The 2D layer samples the first 3D layer's output (sample_from) and applies
  sepia+vignette (apply_post_process_from); the second 3D layer uses the 2D layer
  as its diffuse texture (use_layer_as_texture).
